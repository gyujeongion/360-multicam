<rect class="bg" width="1000" height="300" rx="14"/><text class="ink" x="24" y="38" font-size="17" font-weight="700">One 360° recording in, a multi-camera edit out</text><rect class="card" x="24" y="64" width="170" height="150" rx="10"/><text class="acc mono" x="38" y="88" font-size="12">01</text><text class="ink" x="38" y="110" font-size="15" font-weight="600">Stitch</text><text class="mute" x="38" y="134" font-size="12.5">factory lens calibration</text><text class="mute" x="38" y="153" font-size="12.5">read from the .insv</text><text class="mute" x="38" y="172" font-size="12.5">optical-flow seams</text><line class="line" x1="196" y1="139" x2="214" y2="139" stroke-width="1.6"/><path class="acc" d="M212,134 L220,139 L212,144 Z"/><rect class="card" x="222" y="64" width="170" height="150" rx="10"/><text class="acc mono" x="236" y="88" font-size="12">02</text><text class="ink" x="236" y="110" font-size="15" font-weight="600">Find people</text><text class="mute" x="236" y="134" font-size="12.5">face detection</text><text class="mute" x="236" y="153" font-size="12.5">gyro-stabilised tracking</text><text class="mute" x="236" y="172" font-size="12.5">identity across cuts</text><line class="line" x1="394" y1="139" x2="412" y2="139" stroke-width="1.6"/><path class="acc" d="M410,134 L418,139 L410,144 Z"/><rect class="card" x="420" y="64" width="170" height="150" rx="10"/><text class="acc mono" x="434" y="88" font-size="12">03</text><text class="ink" x="434" y="110" font-size="15" font-weight="600">Wide masters</text><text class="mute" x="434" y="134" font-size="12.5">one 4K Pannini view</text><text class="mute" x="434" y="153" font-size="12.5">per person, plus a</text><text class="mute" x="434" y="172" font-size="12.5">fixed cabin wide</text><line class="line" x1="592" y1="139" x2="610" y2="139" stroke-width="1.6"/><path class="acc" d="M608,134 L616,139 L608,144 Z"/><rect class="card" x="618" y="64" width="170" height="150" rx="10"/><text class="acc mono" x="632" y="88" font-size="12">04</text><text class="ink" x="632" y="110" font-size="15" font-weight="600">Who is talking</text><text class="mute" x="632" y="134" font-size="12.5">active-speaker model,</text><text class="mute" x="632" y="153" font-size="12.5">or a diarized</text><text class="mute" x="632" y="172" font-size="12.5">transcript</text><line class="line" x1="790" y1="139" x2="808" y2="139" stroke-width="1.6"/><path class="acc" d="M806,134 L814,139 L806,144 Z"/><rect class="card" x="816" y="64" width="170" height="150" rx="10"/><text class="acc mono" x="830" y="88" font-size="12">05</text><text class="ink" x="830" y="110" font-size="15" font-weight="600">Premiere edit</text><text class="mute" x="830" y="134" font-size="12.5">FCP7 XML: cuts follow</text><text class="mute" x="830" y="153" font-size="12.5">the speaker, framing</text><text class="mute" x="830" y="172" font-size="12.5">stays adjustable</text><text class="mute mono" x="24" y="250" font-size="12.5">input   VID_xxx_00_001.insv  (dual fisheye, 8K)</text><text class="mute mono" x="24" y="272" font-size="12.5">output  premiere.xml · preview.mp4 · masters/cam_&lt;ID&gt;.mp4 · panorama.mp4</text></svg>