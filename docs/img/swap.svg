<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="edit on the 4K panorama, render from the original"><style>
  .bg{fill:#fbfaf7} .card{fill:#ffffff;stroke:#d9d4ca} .ink{fill:#1d1b18} .mute{fill:#6f6a61}
  .acc{fill:#c2410c} .accs{stroke:#c2410c} .line{stroke:#9b958a} .soft{fill:#f1ede4}
  .s1{fill:#2f6f8f} .s2{fill:#c2410c} .s3{fill:#5b7f3a} .wide{fill:#b9b2a5}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  @media (prefers-color-scheme: dark){
    .bg{fill:#151413} .card{fill:#1e1c1a;stroke:#3a3631} .ink{fill:#ece8e1} .mute{fill:#a39d93}
    .acc{fill:#f08a4b} .accs{stroke:#f08a4b} .line{stroke:#6b665e} .soft{fill:#26231f}
