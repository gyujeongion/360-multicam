  }
</style>
<rect class="bg" width="1000" height="330" rx="14"/><text class="ink" x="24" y="38" font-size="17" font-weight="700">Frame on the light 4K panorama, deliver from the 8K original</text><rect class="card" x="24" y="62" width="290" height="200" rx="10"/><text class="ink" x="38" y="108" font-size="15" font-weight="600">1 · Edit in Premiere</text><text class="mute" x="38" y="132" font-size="12.5">4K panorama.mp4 + VR Projection</text><text class="mute" x="38" y="151" font-size="12.5">pan / tilt / roll keyframes</text><text class="mute" x="38" y="170" font-size="12.5">(orbcut vrkeys gives a start</text><text class="mute" x="38" y="189" font-size="12.5"> that follows a person)</text><polyline points="40,232.0 53,221.93699869518105 66,214.87247988707625 79,212.41017427116788 92,214.11737071704903 105,217.96885415853237 118,221.60443890601272 131,223.6790770799609 144,224.54296578448597 157,225.8771888343668 170,229.50846806593327 183,236.09671576959855 196,244.46568117474644 209,251.98638768820993 222,255.82814938715964 235,254.3979609567507 248,248.1747473873915 261,239.4756123652342 274,231.28175684533804 287,225.7708144956221" fill="none" class="accs" stroke-width="2"/><rect class="acc" x="36.5" y="228.5" width="7" height="7" transform="rotate(45 40 232.0)"/><rect class="acc" x="88.5" y="210.61737071704903" width="7" height="7" transform="rotate(45 92 214.11737071704903)"/><rect class="acc" x="140.5" y="221.04296578448597" width="7" height="7" transform="rotate(45 144 224.54296578448597)"/><rect class="acc" x="192.5" y="240.96568117474644" width="7" height="7" transform="rotate(45 196 244.46568117474644)"/><rect class="acc" x="244.5" y="244.6747473873915" width="7" height="7" transform="rotate(45 248 248.1747473873915)"/><line class="line" x1="316" y1="162" x2="348" y2="162" stroke-width="1.6"/><path class="acc" d="M346,157 L354,162 L346,167 Z"/><rect class="card" x="356" y="62" width="290" height="200" rx="10"/><text class="ink" x="370" y="108" font-size="15" font-weight="600">2 · Render the angles</text><text class="mute" x="370" y="132" font-size="12.5">dump-script reads the keyframes</text><text class="mute" x="370" y="151" font-size="12.5">plan → render from the original</text><text class="mute" x="370" y="170" font-size="12.5">on any Mac that can decode 8K</text><text class="mute" x="370" y="189" font-size="12.5">same direction, same field of view</text><text class="mute mono" x="370" y="236" font-size="12">8K original → sequence-size 10-bit HEVC</text><line class="line" x1="648" y1="162" x2="680" y2="162" stroke-width="1.6"/><path class="acc" d="M678,157 L686,162 L678,167 Z"/><rect class="card" x="688" y="62" width="288" height="200" rx="10"/><text class="ink" x="702" y="108" font-size="15" font-weight="600">3 · Place back</text><text class="mute" x="702" y="132" font-size="12.5">new top track, same positions</text><text class="mute" x="702" y="151" font-size="12.5">panorama clips disabled,</text><text class="mute" x="702" y="170" font-size="12.5">kept underneath to revert</text><text class="mute" x="702" y="189" font-size="12.5"></text><rect class="acc" x="704" y="200" width="70" height="16" rx="3"/><rect class="wide" x="704" y="222" width="70" height="16" rx="3" opacity="0.6"/><rect class="acc" x="778" y="200" width="96" height="16" rx="3"/><rect class="wide" x="778" y="222" width="96" height="16" rx="3" opacity="0.6"/><rect class="acc" x="878" y="200" width="82" height="16" rx="3"/><rect class="wide" x="878" y="222" width="82" height="16" rx="3" opacity="0.6"/><text class="mute mono" x="704" y="196" font-size="10.5">V2 original</text><text class="mute mono" x="704" y="252" font-size="10.5">V1 panorama (off)</text><text class="mute" x="24" y="300" font-size="12.5">Measured on a 32 s tracked clip: face position within 2.4 % of the Premiere preview, faces about 38× sharper.</text></svg>