<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="speaker-following cuts"><style>
  .bg{fill:#fbfaf7} .card{fill:#ffffff;stroke:#d9d4ca} .ink{fill:#1d1b18} .mute{fill:#6f6a61}
  .acc{fill:#c2410c} .accs{stroke:#c2410c} .line{stroke:#9b958a} .soft{fill:#f1ede4}
  .s1{fill:#2f6f8f} .s2{fill:#c2410c} .s3{fill:#5b7f3a} .wide{fill:#b9b2a5}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  @media (prefers-color-scheme: dark){
    .bg{fill:#151413} .card{fill:#1e1c1a;stroke:#3a3631} .ink{fill:#ece8e1} .mute{fill:#a39d93}
    .acc{fill:#f08a4b} .accs{stroke:#f08a4b} .line{stroke:#6b665e} .soft{fill:#26231f}
    .s1{fill:#5aa3c4} .s2{fill:#f08a4b} .s3{fill:#8fb86a} .wide{fill:#57524a}
  }
</style>
<rect class="bg" width="1000" height="330" rx="14"/><text class="ink" x="24" y="38" font-size="17" font-weight="700">Cuts follow the voice, framing stays editable</text><line class="line" x1="150.0" y1="62" x2="150.0" y2="248" stroke-width="0.6" stroke-dasharray="2 4"/><text class="mute mono" x="144.0" y="268" font-size="11">0s</text><line class="line" x1="286.66666666666663" y1="62" x2="286.66666666666663" y2="248" stroke-width="0.6" stroke-dasharray="2 4"/><text class="mute mono" x="280.66666666666663" y="268" font-size="11">5s</text><line class="line" x1="423.3333333333333" y1="62" x2="423.3333333333333" y2="248" stroke-width="0.6" stroke-dasharray="2 4"/><text class="mute mono" x="417.3333333333333" y="268" font-size="11">10s</text><line class="line" x1="560.0" y1="62" x2="560.0" y2="248" stroke-width="0.6" stroke-dasharray="2 4"/><text class="mute mono" x="554.0" y="268" font-size="11">15s</text><line class="line" x1="696.6666666666666" y1="62" x2="696.6666666666666" y2="248" stroke-width="0.6" stroke-dasharray="2 4"/><text class="mute mono" x="690.6666666666666" y="268" font-size="11">20s</text><line class="line" x1="833.3333333333334" y1="62" x2="833.3333333333334" y2="248" stroke-width="0.6" stroke-dasharray="2 4"/><text class="mute mono" x="827.3333333333334" y="268" font-size="11">25s</text><line class="line" x1="970.0" y1="62" x2="970.0" y2="248" stroke-width="0.6" stroke-dasharray="2 4"/><text class="mute mono" x="964.0" y="268" font-size="11">30s</text><text class="mute" x="24" y="86" font-size="12.5">Speaker 1</text><rect class="s1" x="150.0" y="75" width="177.66666666666663" height="14" rx="3" opacity="0.85"/><rect class="s1" x="560.0" y="75" width="109.33333333333337" height="14" rx="3" opacity="0.85"/><rect class="s1" x="874.3333333333334" y="75" width="95.66666666666663" height="14" rx="3" opacity="0.85"/><text class="mute" x="24" y="116" font-size="12.5">Speaker 2</text><rect class="s2" x="319.4666666666667" y="105" width="131.2" height="14" rx="3" opacity="0.85"/><rect class="s2" x="683.0" y="105" width="123.0" height="14" rx="3" opacity="0.85"/><text class="mute" x="24" y="146" font-size="12.5">Speaker 3</text><rect class="s3" x="456.1333333333333" y="135" width="98.39999999999998" height="14" rx="3" opacity="0.85"/><rect class="s3" x="806.0" y="135" width="62.866666666666674" height="14" rx="3" opacity="0.85"/><text class="mute" x="24" y="186" font-size="12.5">matched to</text><text class="ink" x="150" y="186" font-size="12.5">1 → person D · 2 → person H · 3 → person G  (on-screen evidence: speaker score, mouth motion, loudness vs. face size)</text><text class="mute" x="24" y="226" font-size="12.5">Premiere V1</text><rect class="s1" x="151.0" y="208" width="170.2" height="30" rx="4"/><text class="bg" x="232.1" y="228" font-size="13" font-weight="600" style="fill:#fff">D</text><rect class="s2" x="323.2" y="208" width="129.2" height="30" rx="4"/><text class="bg" x="383.79999999999995" y="228" font-size="13" font-weight="600" style="fill:#fff">H</text><rect class="s3" x="454.4" y="208" width="104.60000000000002" height="30" rx="4"/><text class="bg" x="502.7" y="228" font-size="13" font-weight="600" style="fill:#fff">G</text><rect class="s1" x="561.0" y="208" width="115.5333333333333" height="30" rx="4"/><text class="bg" x="614.7666666666667" y="228" font-size="13" font-weight="600" style="fill:#fff">D</text><rect class="s2" x="678.5333333333333" y="208" width="126.4666666666667" height="30" rx="4"/><text class="bg" x="737.7666666666667" y="228" font-size="13" font-weight="600" style="fill:#fff">H</text><rect class="wide" x="807.0" y="208" width="63.60000000000002" height="30" rx="4"/><text class="bg" x="822.8" y="228" font-size="13" font-weight="600" style="fill:#fff">wide</text><rect class="s1" x="872.6" y="208" width="96.39999999999998" height="30" rx="4"/><text class="bg" x="916.8" y="228" font-size="13" font-weight="600" style="fill:#fff">D</text><text class="mute" x="24" y="300" font-size="12.5">Each shot is a clip of that person's wide master with Scale/Position set from the face, so you can still reframe or retime it by hand.</text></svg>