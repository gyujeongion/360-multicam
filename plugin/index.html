<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="row">
    <sp-button id="open" variant="primary">결과 불러오기</sp-button>
    <sp-button id="importXml" variant="secondary">XML 가져오기</sp-button>
  </section>
  <p id="status" class="status">multicam360 출력 폴더의 premiere_shots.json을 고르세요.</p>

  <section class="row">
    <sp-button id="applyAll" variant="cta" disabled>자동 구도 전체 적용</sp-button>
  </section>

  <h3>선택한 클립 미세조정</h3>
  <section class="grid">
    <sp-action-button data-act="scale" data-v="2">확대 +2%</sp-action-button>
    <sp-action-button data-act="scale" data-v="-2">축소 −2%</sp-action-button>
    <sp-action-button data-act="pos" data-dx="0" data-dy="-0.01">위로</sp-action-button>
    <sp-action-button data-act="pos" data-dx="0" data-dy="0.01">아래로</sp-action-button>
    <sp-action-button data-act="pos" data-dx="-0.01" data-dy="0">왼쪽</sp-action-button>
    <sp-action-button data-act="pos" data-dx="0.01" data-dy="0">오른쪽</sp-action-button>
  </section>

  <h3>샷 목록</h3>
  <ul id="shots" class="shots"></ul>
  <script src="index.js"></script>
</body>
</html>
